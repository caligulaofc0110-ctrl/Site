<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar notas | Notas Escolares</title>
  <link rel="stylesheet" href="style.css">
  <script src="notas.js" defer></script>
</head>
<body>
  <header class="topo">
    <div class="container topo-conteudo">
      <div class="marca">
        <span class="marca-icone">N</span>
        <span>Notas<span class="marca-destaque">Escolares</span></span>
      </div>

      <a href="index.html" class="botao botao-secundario voltar-topo">
        ← Voltar à lista
      </a>
    </div>
  </header>

  <main class="container principal">
    <section class="apresentacao">
      <span class="etiqueta">ÁREA ACADÊMICA</span>
      <h1>Gerenciar notas</h1>
      <p>Consulte, adicione ou altere as notas bimestrais do aluno.</p>
    </section>

    <section class="painel">
      <div class="painel-cabecalho">
        <div>
          <h2 id="titulo-aluno">Carregando aluno...</h2>
          <p id="subtitulo-aluno">
            Buscando os dados do cadastro.
          </p>
        </div>

        <span class="resumo-icone verde icone-grande" aria-hidden="true">
          ✎
        </span>
      </div>

      <p
        id="mensagem-pagina"
        class="mensagem"
        role="status"
        aria-live="polite">
      </p>

      <form id="form-notas">
        <div class="campos">
          <div class="campo">
            <label for="nota1">Nota do 1º bimestre</label>
            <input
              type="number"
              id="nota1"
              min="0"
              max="10"
              step="0.1"
              placeholder="Ex.: 8,5"
              required
              disabled>
          </div>

          <div class="campo">
            <label for="nota2">Nota do 2º bimestre</label>
            <input
              type="number"
              id="nota2"
              min="0"
              max="10"
              step="0.1"
              placeholder="Ex.: 9,0"
              required
              disabled>
          </div>
        </div>

        <div class="acoes-formulario">
          <p class="mensagem">
            As notas devem estar entre 0 e 10.
          </p>

          <button
            type="submit"
            id="btn-salvar"
            class="botao botao-principal"
            disabled>
            Salvar notas
          </button>
        </div>
      </form>
    </section>

    <footer>
      Sistema de estudo · Gerenciamento de notas escolares
    </footer>
  </main>
</body>
</html>
